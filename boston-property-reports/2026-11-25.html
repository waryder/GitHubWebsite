<h1>Boston Property Report — 2026-11-25</h1>

<div class="summary">Section 1: 19 detail-verified listings: Canton MA 3, Stoughton MA 3 (incl. 1600 West St 1.65 ac at $200,000 with public sewer), Sharon MA 5, Mansfield MA 2 (350 Mill St 3.09 ac with public water and sewer), Attleboro MA 1, and Rehoboth MA 5 (rail-flagged). Norwood MA had no land. Section 2 is thin: 2 Narragansett RI two-families, both with disputed price or status, plus rate benchmarks for 5 areas; the Narragansett RI STR injunction is still in force. Section 3: 15 duplexes, 6 clean actives (incl. 562 Newport Ave and 13 Parker Ct, Attleboro MA, and 31 Child St, Warren RI) and 9 pending or flagged.</div>

<div class="criteria">
<strong>Criteria.</strong> <strong>Section 1</strong> — corridor land &amp; homes, 0.75–5.0 acres inclusive (vacant/buildable, teardown, or single-family) in Canton MA, Stoughton MA, Sharon MA, Norwood MA, Mansfield MA, Attleboro MA and Rehoboth MA; public water + sewer preferred (recorded, not filtered); ≤10 min to a Providence/Stoughton line station; ≤15 min hospital, ≤30 min highly rated library, ≤30 min Planet Fitness. Manufactured-home requirement dropped (2026-07-31). Rehoboth MA fails the rail rule (~18–22 min) and is included, flagged.<br>
<strong>Section 2</strong> — small southern-RI beach-area properties to buy and rent by the week (condos, two-families, mobile/manufactured, small cottages).<br>
<strong>Section 3</strong> — owner-occupant duplexes / two-families across the combined footprint, no price or lot caps.<br>
Each run is a fresh search; no day-over-day deltas. All drive times are <em>estimates</em>.
</div>

<h3>STR rules by town</h3>
<ul>
<li><b>Narragansett RI:</b> <span class="flag">May 2024 ordinance (7-night minimum, permit cap 1,100 / 1,000 / 900, $1M insurance) remains ENJOINED</span> — preliminary injunction 10/2/2024, Narragansett 2100, Inc. v. Town, WC-2024-0372; no final judgment found. Aug–Sep 2026 secondary sources say the injunction has not been lifted; no newer docket or news found. Town rental registration ($120/unit, due Aug 31) still applies. <a href="https://www.courts.ri.gov/Decisions/Superior-WC-2024-0372.pdf" target="_blank" rel="noopener">Court order</a> · <a href="https://www.airhostd.com/post/narragansett-short-term-rental-rules" target="_blank" rel="noopener">Air Hostd (8/24/2026)</a> · <a href="https://phippsrealty.com/blog/the-math-problem-behind-narragansetts-short-term-rental-cap" target="_blank" rel="noopener">Phipps Realty (9/10/2026)</a></li>
<li><b>South Kingstown RI:</b> STR registration ordinance adopted 4/8/2024; the town suspended enforcement 11/14/2024–12/31/2025. 2026 status unconfirmed. <a href="https://www.southkingstownri.gov/CivicAlerts.aspx?AID=1437" target="_blank" rel="noopener">Town notice</a></li>
<li><b>North Kingstown RI:</b> No local STR ordinance verified; state DBR registration applies. <a href="https://dbr.ri.gov/real-estate-and-commercial-licensing/short-term-rentals/short-term-rentals-FAQs" target="_blank" rel="noopener">DBR FAQ</a></li>
<li><b>Jamestown RI:</b> Town STR ordinance (8/7/2023): application, building + fire inspections, state registration; fees not confirmed. <a href="https://jamestownri.gov/town-departments/clerk-2023/short-term-rentals" target="_blank" rel="noopener">Town page</a></li>
<li><b>Warwick RI:</b> STRs allowed in residential/village zones only; $250/unit/yr permit plus inspections. <span class="flag">ADUs, accessory structures and affordable units barred from STR use.</span> Source is a 2023 memo — confirm current rules. <a href="https://www.rilegislature.gov/commissions/STRC/commdocs/City%20of%20Warwick%20-%20STR%20Memo%2010-11-23.pdf" target="_blank" rel="noopener">Memo</a></li>
<li><b>Warren RI:</b> <span class="flag">Town-wide cap of 125 STR units; max 50% of units per building</span> (existing exempt); $100/yr registration, parking + 2-hour local-rep rules. <a href="https://eastbayri.com/stories/warrens-new-law-caps-density-and-total-number-of-short-term-rentals,110795" target="_blank" rel="noopener">EastBayRI</a></li>
<li><b>Statewide RI:</b> 5% whole-home STR tax (stays ≤30 days via platforms) effective 2026-01-01; local hotel tax 1%→2%; trafficking-prevention training required. <a href="https://www.rirealtors.org/news/2025/12/12/news/new-short-term-rental-laws-going-into-effect-january-1/" target="_blank" rel="noopener">RI Realtors</a> · <a href="https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/FAQs%20Whole%20Home%20Tax%20Final.pdf" target="_blank" rel="noopener">RI Taxation FAQ</a></li>
</ul>

<h2>Coverage &amp; Caveats</h2>
<ul>
<li>Primary verification was Homes.com detail pages fetched 2026-11-25, with LandSearch, Coldwell Banker, Raveis, Weichert, Redfin and Zillow detail pages as supplements. Most MA rows rest on a single source class, so Redfin-vs-Zillow status disputes could not be ruled out.</li>
<li>Failed or not fetched: LandSearch detail pages for 576 Moose Hill St, Sharon MA; 331 Mountain St, Sharon MA; and 155 Pike Ave, Attleboro MA (client errors). Also Redfin detail pages and the Oakland Beach (Warwick RI) neighborhood page, AirDNA pages for Narragansett RI and North Kingstown RI (AirROI used instead), and LandWatch/Zillow/Realtor.com land channels (budget). Nothing was bypassed.</li>
<li>No existing single-family homes or teardowns of 0.75–5 ac were verified in Mansfield MA, Attleboro MA or Rehoboth MA (Homes.com land pages return land only). That is a coverage gap, not a confirmed zero.</li>
<li>Section 2 is thin today: only 2 buys, both disputed, with no Warwick RI shore, Jamestown RI or North Kingstown RI condo/cottage verified. Weekly rates are ADR × 7 (a booked-week figure, not an average week). Beach and station times are estimates.</li>
<li>Hospital, library and Planet Fitness times are town-level estimates, not per-parcel measurements.</li>
<li>Still open for Bill: the Section 2 rail-rule tension and the unresolved Narragansett RI STR litigation.</li>
</ul>
