name: Generate site index

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-index:
    # Skip if this push was made by this workflow itself
    if: "!contains(github.event.head_commit.message, '[skip-index]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate index.html
        run: python scripts/generate_index.py

      - name: Commit index.html if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html unchanged — nothing to commit."
          else
            git add index.html
            git commit -m "Auto-update site index [skip-index]"
            git push
          fi
